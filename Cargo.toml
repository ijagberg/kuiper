[package]
name = "kuiper"
description = "An easy-to-use HTTP integration testing tool"
version = "0.0.6"
edition = "2021"
authors = ["Isak Jägberg <ijagberg@gmail.com>"]
license = "MIT"
keywords = ["postman", "integration", "requests"]
categories = ["command-line-utilities", "development-tools::testing"]
repository = "https://github.com/ijagberg/kuiper"
homepage = "https://github.com/ijagberg/kuiper"

[lib]
name="lib"
path="src/lib.rs"


[[bin]]
name="kuiper"
path="src/bin.rs"


[dependencies]
clap = { version = "4.5.18", features = ["derive"] }
dotenv = "0.15.0"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.12.7", features = ["blocking", "json"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
log = "0.4.22"
uuid = { version = "1.10.0", features = ["v4"] }
jiff = "0.1.13"
test-log = "0.2.17"
bytes = "1.10.1"
